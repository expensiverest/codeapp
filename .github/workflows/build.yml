name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Frameworks
        run: ./downloadFrameworks.sh

      - name: List Schemes
        run: xcodebuild -project Code.xcodeproj -list

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/CodeApp.app build/Payload/
          cd build
          zip -r CodeApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned
          path: build/CodeApp.ipa
